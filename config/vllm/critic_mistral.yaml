# vLLM (OpenAI-compatible) config — started by kaggle/start_vllm.sh on port 8003.
# Critic (Mistral family). Gemma-2 does not run on T4: vLLM refuses it in fp16.
model:
  provider: vllm
  name: solidrust/Mistral-7B-Instruct-v0.3-AWQ
  base_url: http://localhost:8003/v1
  temperature: 0.3
  max_tokens: 1024
  top_p: 1.0
agents:
  solver:
    temperature: 0.3
    max_tokens: 1024
  critic:
    temperature: 0.2
    max_tokens: 768
  verifier:
    temperature: 0.0
    max_tokens: 768
